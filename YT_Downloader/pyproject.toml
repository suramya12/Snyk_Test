[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "liquidglass-downloader"
version = "2.4.0"
description = "LiquidGlass YouTube Downloader — optimized performance, intelligent caching, auto-updates, polished GUI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="You"}]
license = {text = "MIT"}
keywords = ["youtube", "downloader", "yt-dlp", "gui", "customtkinter", "auto-update"]

dependencies = [
  # Core dependencies - kept up to date automatically
  "yt-dlp>=2024.12.13",        # Latest stable, auto-updated
  "pydantic>=2.10.3",          # Latest stable with performance improvements
  "platformdirs>=4.3.6",       # Latest stable
  "customtkinter>=5.2.2",      # Latest stable GUI framework
  "Pillow>=11.0.0",            # Latest stable for image processing
  "rich>=13.9.4",              # Latest stable for CLI formatting
  "requests>=2.32.3",          # Latest stable HTTP library
  "packaging>=24.2",           # For version comparison in updater
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "black>=24.2", "mypy>=1.8", "pytest>=8"]

[project.scripts]
liquidglass-downloader = "liquidglass_downloader.cli:main"
liquidglass-gui = "liquidglass_downloader.ui.app:main"
